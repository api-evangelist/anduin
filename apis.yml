aid: anduin
name: Anduin
description: >-
  Anduin (Anduin Transactions) is a private-markets technology company that
  digitizes investor onboarding and fund operations for venture capital,
  private equity, and hedge funds. Its platform replaces paper-based
  subscription workflows with electronic fund subscription documents, secure
  data rooms, investor data management, an engagement hub, an integration hub,
  automated data extraction, and e-signature. The company reports 1,305+ funds
  served, $244B+ capital raised, and 74,000+ investors subscribed. Anduin
  publishes no public developer API or OpenAPI; this profile captures its
  public company, trust, and security surfaces (Trust Center, RFC 9116
  security.txt, and domain-security posture). Backed by 8vc; surfaced to the
  API Evangelist network as a portfolio lead and enriched by the pipeline.
